name: Release Build 单包打包

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.set-ver.outputs.version }}
      gitee: ${{ steps.check.outputs.gitee }}
      contributors_content: ${{ steps.contributors.outputs.content }}
    steps:
      - id: set-ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 版本号规则：从 X1.0 起，每次构建 +0.1（十进制）；等价于次版本 0→9、满 10 进 1，X1.9 → X2.0
          # 主版本也允许手动升（推一个 X2.0 的 tag 后，后续自动从 X2.1 续）
          prev=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            | jq -r '.[].tag_name' | sed -E 's/^beta-//' \
            | grep -E '^[Xx][0-9]+\.[0-9]+$' | sed -E 's/^[Xx]//' | sort -V | tail -n 1 || true)
          if [ -z "$prev" ]; then
            version="X1.0"
            echo "已确定版本号 $version（首个代号版本）"
          else
            major=${prev%%.*}
            minor=${prev##*.}
            # 每次 +0.1，满 10 进 1：X1.9 → X2.0，X2.9 → X3.0
            if [ "$minor" -ge 9 ]; then
              version="X$(( major + 1 )).0"
            else
              version="X${major}.$(( minor + 1 ))"
            fi
            echo "已确定版本号 $version（上一版 X$prev）"
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
      - id: check
        run: |
          if [ -n "${{ secrets.GITEE_TOKEN }}" ]; then
            echo "gitee=yes" >> $GITHUB_OUTPUT
          fi

      # 发布说明的「PR + 贡献者」章节（与 test.yml 共用同一脚本）
      - uses: actions/checkout@v5
      - name: Setup Node (release notes)
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - id: contributors
        name: Generate Contributor Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_HEAD_REF: ${{ github.sha }}
          RELEASE_CURRENT_TAG: ${{ steps.set-ver.outputs.version }}
        run: |
          node .github/scripts/release-notes.mjs --out release-notes-contributors.md || echo "::warning::贡献者章节生成失败，本次发版不附带该章节"
          CONTENT_JSON=$(jq -Rs . release-notes-contributors.md 2>/dev/null || echo '""')
          echo "content=$CONTENT_JSON" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        product: [ appMax ]   # 只打一个包（app 的 release，arm64-v8a）
      fail-fast: false
      max-parallel: 4
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    env:
      product: ${{ matrix.product }}
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/build/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 统一版本号
        run: |
          sed "/def version/c def version = \"${{ env.VERSION }}\"" app/build.gradle -i

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: 开始打包
        run: |
          chmod +x gradlew
          ./gradlew assemble${{ env.product }}Release --parallel --build-cache --no-daemon

      - name: 上传 APK（带产品标识）
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.product }}_apk
          path: app/build/outputs/apk/${{ env.product }}/release/*.apk
          retention-days: 1

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有 APK
        uses: actions/download-artifact@v7
        with:
          pattern: '*_apk'
          path: all_apks
          merge-multiple: true

      - name: 列出下载的文件（调试用）
        run: ls -la all_apks/

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 阅读X ${{ needs.prepare.outputs.version }}
          tag_name: ${{ needs.prepare.outputs.version }}
          body: |
            ## 阅读X ${{ needs.prepare.outputs.version }}

            单一 arm64-v8a 安装包，覆盖安装即可。

            ${{ fromJSON(needs.prepare.outputs.contributors_content || '""') }}
          prerelease: true
          files: all_apks/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gitee:
    needs: [prepare, build]
    if: github.event_name != 'pull_request' && needs.prepare.outputs.gitee == 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有 APK
        uses: actions/download-artifact@v7
        with:
          pattern: '*_apk'
          path: all_apks
          merge-multiple: true

      - name: 发布到 Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: "GEd520"
          GITEE_REPO: "legados"
          VERSION: ${{ needs.prepare.outputs.version }}
          CONTRIBUTORS_JSON: ${{ needs.prepare.outputs.contributors_content || '""' }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl
          API_BASE="https://gitee.com/api/v5/repos/$GITEE_USER/$GITEE_REPO"
          AUTH_HEADER="Authorization: token $GITEE_TOKEN"
          
          TAG_NAME="$VERSION"
          RELEASE_NAME="阅读X $VERSION"
          CONTRIBUTORS=$(printf '%s' "$CONTRIBUTORS_JSON" | jq -r . 2>/dev/null || true)
          RELEASE_BODY=$(printf '## 阅读X %s\n\n单一 arm64-v8a 安装包，覆盖安装即可。\n' "$VERSION")
          if [ -n "$CONTRIBUTORS" ]; then
            RELEASE_BODY=$(printf '%s\n%s\n' "$RELEASE_BODY" "$CONTRIBUTORS")
          fi
          
          echo "📦 直接创建新release，保留历史版本"
          
          PAYLOAD=$(jq -n \
            --arg tag_name "$TAG_NAME" \
            --arg name "$RELEASE_NAME" \
            --arg body "$RELEASE_BODY" \
            --arg target_commitish "main" \
            '{tag_name: $tag_name, name: $name, body: $body, target_commitish: $target_commitish, prerelease: true}')
          RELEASE_JSON=$(curl -sS -X POST \
              -H "Content-Type: application/json" \
              -H "$AUTH_HEADER" \
              -d "$PAYLOAD" \
              "$API_BASE/releases")
          
          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            echo "❌ 创建Release失败"
            exit 1
          fi
          
          echo "🚀 开始并行上传APK文件..."
          PIDS=()
          for APK_FILE in all_apks/*.apk; do
            curl -sS -X POST \
              -H "$AUTH_HEADER" \
              -F "file=@$APK_FILE" \
              "$API_BASE/releases/$RELEASE_ID/attach_files" &
            PIDS+=($!)
          done
          
          for PID in "${PIDS[@]}"; do
            wait $PID
          done
          echo "✅ 所有APK上传完成"